[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-model-sync"
version = "0.1.0"
description = "Portable Claude-compatible model catalog synchronization and strict alias proxy"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Steve Xin"}]
keywords = ["claude", "agent-skills", "model-catalog", "openclaw"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
yaml = ["PyYAML>=6"]
test = ["pytest>=8"]

[project.scripts]
claude-model-sync = "claude_model_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
